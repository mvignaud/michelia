# État des derniers builds et envois EAS, lu avec EXPO_TOKEN (aucune modification).
# Se lance à la main : GitHub > Actions > « État Expo » > Run workflow.
name: État Expo

on:
  workflow_dispatch:
    inputs:
      envoi:
        description: ID d'un envoi EAS à détailler (facultatif)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  etat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derniers builds
        run: >
          npx eas-cli@latest build:list --limit 5 --non-interactive --json
          | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const b of JSON.parse(s))console.log([b.platform,b.status,b.appBuildVersion,b.createdAt,b.error?.message??""].join(" | "))})'
      - name: Envoi
        if: inputs.envoi != ''
        env:
          ENVOI: ${{ inputs.envoi }}
        run: |
          node -e '
            const q = `query($id: ID!) { submissions { byId(submissionId: $id) { status platform error { errorCode message } logsUrl } } }`;
            fetch("https://api.expo.dev/graphql", {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: "Bearer " + process.env.EXPO_TOKEN },
              body: JSON.stringify({ query: q, variables: { id: process.env.ENVOI } }),
            }).then((r) => r.json()).then((j) => console.log(JSON.stringify(j, null, 2)));
          '
