# État des derniers builds et envois EAS, lu avec EXPO_TOKEN (aucune modification).
# Se lance à la main : GitHub > Actions > « État Expo » > Run workflow.
name: État Expo

on:
  workflow_dispatch:
    inputs:
      envoi:
        description: ID d'un envoi EAS à détailler (facultatif)
        type: string
        default: ''
      build:
        description: ID d'un build EAS dont afficher les lignes d'erreur (facultatif)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  etat:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # API GraphQL d'Expo : réponse affichée telle quelle (erreurs comprises).
      - name: Builds et envoi
        env:
          ENVOI: ${{ inputs.envoi }}
          BUILD: ${{ inputs.build }}
        run: |
          node -e '
            const gql = (query, variables) =>
              fetch("https://api.expo.dev/graphql", {
                method: "POST",
                headers: { "Content-Type": "application/json", Authorization: "Bearer " + process.env.EXPO_TOKEN },
                body: JSON.stringify({ query, variables }),
              }).then((r) => r.json());
            (async () => {
              const builds = await gql(
                `query($id: String!) { app { byId(appId: $id) { builds(offset: 0, limit: 5) {
                  id platform status appBuildVersion createdAt error { errorCode message } } } } }`,
                { id: "071f33b5-c576-4db2-bc57-cdf39a04e048" },
              );
              console.log(JSON.stringify(builds, null, 2));
              if (process.env.ENVOI) {
                const envoi = await gql(
                  `query($id: ID!) { submissions { byId(submissionId: $id) { status platform error { errorCode message } logsUrl } } }`,
                  { id: process.env.ENVOI },
                );
                console.log(JSON.stringify(envoi, null, 2));
              }
              if (process.env.BUILD) {
                const b = await gql(`query($id: ID!) { builds { byId(buildId: $id) { status logFiles } } }`, { id: process.env.BUILD });
                const fichiers = b.data?.builds?.byId?.logFiles ?? [];
                if (!fichiers.length) console.log(JSON.stringify(b, null, 2));
                for (const url of fichiers) {
                  const lignes = (await (await fetch(url)).text()).split("\n").map((l) => {
                    try { return JSON.parse(l).msg ?? l; } catch { return l; }
                  });
                  const utiles = lignes.filter((l) => /pod|error|requir|depend|compatib|deployment/i.test(l));
                  console.log(utiles.slice(-80).join("\n"));
                }
              }
            })();
          '
