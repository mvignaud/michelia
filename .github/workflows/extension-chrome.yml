# Extension Chrome : vérifie le manifeste et les scripts, puis prépare le .zip à déposer sur le Chrome Web Store.
# Le .zip se télécharge en bas de la page du run (Artifacts > michel-extension-chrome).
# Se lance tout seul quand extension/ change, ou à la main : GitHub > Actions > « Extension Chrome » > Run workflow.
name: Extension Chrome

on:
  workflow_dispatch:
  pull_request:
    paths: ['extension/**', '.github/workflows/extension-chrome.yml']
  push:
    branches: [main]
    paths: ['extension/**', '.github/workflows/extension-chrome.yml']

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Manifeste et scripts
        working-directory: extension
        run: |
          node -e '
            const m = require("./manifest.json");
            const fs = require("fs");
            if (m.manifest_version !== 3) throw new Error("Manifest V3 attendu");
            if (m.description.length > 132) throw new Error("Description > 132 caractères (limite du Web Store)");
            const fichiers = [m.side_panel.default_path, m.background.service_worker, ...Object.values(m.icons)];
            for (const f of fichiers) if (!fs.existsSync(f)) throw new Error("Fichier manquant : " + f);
            console.log("Michel IA", m.version);
          '
          for f in *.js; do node --check "$f"; done
      - name: Paquet
        working-directory: extension
        run: |
          version=$(node -p 'require("./manifest.json").version')
          zip -r -X "../michel-extension-chrome-$version.zip" . -x '*.md'
      - uses: actions/upload-artifact@v4
        with:
          name: michel-extension-chrome
          path: michel-extension-chrome-*.zip
