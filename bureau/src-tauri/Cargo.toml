[package]
name = "michelia"
version = "1.0.0"
description = "Michel, le papi du Gers coincé dans l'ordinateur"
authors = ["GOLDEN PRINT SAS"]
license = "GPL-3.0-or-later"
repository = "https://github.com/mvignaud/michelia"
edition = "2021"
rust-version = "1.77"

[lib]
name = "michelia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2.8"
tauri-plugin-dialog = "2.8"
tauri-plugin-deep-link = "2.6"
tauri-plugin-window-state = "2.5"
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
