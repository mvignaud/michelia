    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #FBF4E8;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Écran d'attente, remplacé par l'appli dès qu'elle démarre. */
      .attente {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font: 600 17px ui-serif, "New York", Georgia, serif;
        color: #7D6E62;
      }
      .attente img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 4px 14px rgba(60, 40, 20, 0.18);
        animation: souffle 1.6s ease-in-out infinite;
      }
      @keyframes souffle {
        50% { transform: scale(1.06) rotate(-3deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .attente img { animation: none; }
      }
    </style>
