# Configuration minimale pour la CLI et l'intégration GitHub de Supabase.
project_id = "michelia"

[functions.chat]
# La fonction exige un utilisateur connecté (compte anonyme compris).
verify_jwt = true

[functions.push]
# N'importe quel utilisateur peut déclencher l'envoi des annonces en attente ;
# un envoi libre (titre et texte fournis) exige la clé service_role.
verify_jwt = true

[functions.annonces]
# Annonces du back-office et désabonnement en un clic depuis les messageries :
# le droit d'administrateur est vérifié dans la fonction elle-même.
verify_jwt = false

[functions.dicton]
# Appelée par pg_cron sans clé : elle n'envoie qu'une fois par jour, après l'heure prévue,
# quel que soit le nombre d'appels.
verify_jwt = false

[functions.lettre]
# La lettre de Michel, appelée chaque matin par pg_cron sans clé : elle n'écrit que tous les
# quinze jours et s'il y a du neuf ; le test du back-office vérifie le droit d'administrateur.
verify_jwt = false

[functions.stripe-webhook]
# Appelée par Stripe, qui n'a pas de JWT Supabase : l'authenticité vient de la signature
# Stripe-Signature, vérifiée dans la fonction avec STRIPE_WEBHOOK_SECRET.
verify_jwt = false

[functions.stancer-webhook]
# Appelée par Stancer, qui n'a pas de JWT Supabase : l'authenticité vient de la signature
# Stancer-Signature, vérifiée dans la fonction avec STANCER_WEBHOOK_SECRET.
verify_jwt = false

[functions.comptoir-paiement]
# Pas de JWT exigé à l'entrée (Stripe et la confirmation n'en ont pas besoin) : avec Stancer, ouvrir un
# paiement et envoyer une carte vérifient eux-mêmes la session Supabase, puis les plafonds en base.
verify_jwt = false

[functions.revenuecat-webhook]
# Appelée par RevenueCat, qui n'a pas de JWT Supabase : l'authenticité vient de l'en-tête
# Authorization, comparé dans la fonction à REVENUECAT_WEBHOOK_AUTH.
verify_jwt = false

[functions.facturer]
# Appelée par pg_cron sans clé : elle ne traite que les pourboires web payés et pas encore facturés,
# avec des clés d'idempotence chez E-KO ; un appel de plus ne crée rien en double.
verify_jwt = false

[functions.stancer-remboursements]
# Appelée par pg_cron sans clé : elle ne fait que relire les paiements chez Stancer et recopier le
# montant remboursé ; un appel de plus ne change rien.
verify_jwt = false

[functions.michelia-plus]
# Le navigateur passe la session Supabase ; la fonction vérifie elle-même le compte (pas anonyme) et
# accepte le retour du 3D Secure (POST de la banque, sans jeton).
verify_jwt = false

[functions.michelia-plus-echeances]
# Appelée par pg_cron sans clé : elle ne prélève que les échéances dues, une seule fois chacune.
verify_jwt = false

[functions.alertes]
# Appelée par pg_cron sans clé : elle n'écrit qu'à Mathieu (alertes_destinataire), une fois par alerte.
verify_jwt = false
